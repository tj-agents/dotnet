name: Scaffold

on:
  push:
    paths:
      - .agents/dotnet/utility/scaffold/**
      - .agents/tests/test_scaffold.py
      - .github/workflows/scaffold.yml
  pull_request:
    paths:
      - .agents/dotnet/utility/scaffold/**
      - .agents/tests/test_scaffold.py
      - .github/workflows/scaffold.yml

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: tj-agents/agent
          ref: main
          path: .agent
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: tj-agents/azure
          ref: main
          path: .azure
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.15'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: v1.17.1
          terraform_wrapper: false
      - run: python -B .agents/tests/test_scaffold.py
      - run: pwsh .agents/sync-generated.ps1 -Check
      - run: python -B .agents/dotnet/utility/scaffold/scripts/verify.py
        env:
          AZURE_SCAFFOLD: ${{ github.workspace }}/.azure/.agents/azure/utility/scaffold/scripts/scaffold.py
          PLUGIN_SELECTION_ADOPTER: ${{ github.workspace }}/.agent/.agents/agent/utility/plugins/scripts/adopt_plugins.py
