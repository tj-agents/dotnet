name: Scaffold

on:
  push:
    paths:
      - .agents/dotnet/utility/scaffold/**
      - .agents/tests/test_scaffold.py
      - .github/workflows/scaffold.yml
  pull_request:
    paths:
      - .agents/dotnet/utility/scaffold/**
      - .agents/tests/test_scaffold.py
      - .github/workflows/scaffold.yml

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tj-agents/core
          ref: 9341db876dee3c57d3e7e83e518e3dd64cb27813
          path: .core
      - uses: actions/checkout@v4
        with:
          repository: tj-agents/azure
          ref: 320779cf68822f13a062f87f01686d3b7276b9db
          path: .azure
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - run: python -B .agents/tests/test_scaffold.py
      - run: pwsh .agents/sync-generated.ps1 -Check
      - name: Compose scaffold standards input
        run: >
          python -B -c 'import json, os, pathlib, subprocess; root = pathlib.Path.cwd(); entries = (("tj-agents/core", root / ".core", ["base", "engineering", "machine"], "base"), ("tj-agents/dotnet", root, ["dotnet"], "dotnet"), ("tj-agents/azure", root / ".azure", ["azure"], "azure")); sources = [{"repository": repository, "checkout": str(checkout.resolve()), "commit": subprocess.check_output(["git", "-C", str(checkout), "rev-parse", "HEAD"], text=True).strip(), "plugins": plugins, "version_plugin": version_plugin} for repository, checkout, plugins, version_plugin in entries]; output = pathlib.Path(os.environ["RUNNER_TEMP"]) / "scaffold-sources.json"; output.write_text(json.dumps({"schema_version": 1, "sources": sources}) + "\n", encoding="utf-8"); pathlib.Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8").write(f"STANDARDS_INPUT={output}\n")'
      - run: python -B .agents/dotnet/utility/scaffold/scripts/verify.py
        env:
          AZURE_SCAFFOLD: ${{ github.workspace }}/.azure/.agents/azure/utility/scaffold/scripts/scaffold.py
          STANDARDS_ADOPTER: ${{ github.workspace }}/.core/.agents/machine/utility/bootstrap-capabilities/scripts/adopt_repository.py
          STANDARDS_INPUT: ${{ env.STANDARDS_INPUT }}
