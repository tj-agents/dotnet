name: Scaffold

on:
  push:
    paths:
      - .agents/dotnet/utility/scaffold/**
      - .agents/tests/test_scaffold.py
      - .github/workflows/scaffold.yml
  pull_request:
    paths:
      - .agents/dotnet/utility/scaffold/**
      - .agents/tests/test_scaffold.py
      - .github/workflows/scaffold.yml

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tj-agents/core
          ref: f29a8bc66559272c6b25fc1413f649b64eda160f
          path: .core
      - uses: actions/checkout@v4
        with:
          repository: tj-agents/azure
          ref: 320779cf68822f13a062f87f01686d3b7276b9db
          path: .azure
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - run: python -B .agents/tests/test_scaffold.py
      - run: pwsh .agents/sync-generated.ps1 -Check
      - run: python -B .agents/dotnet/utility/scaffold/scripts/verify.py
        env:
          AZURE_SCAFFOLD: ${{ github.workspace }}/.azure/.agents/azure/utility/scaffold/scripts/scaffold.py
          PLUGIN_LOCK_ADOPTER: ${{ github.workspace }}/.core/.agents/machine/utility/plugin-lock/scripts/adopt_plugins.py
          MARKETPLACE_REVISION: 07c8b399e4c2e70a30340c7b0b11a8a7b1074e80
