name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
$FUNCTIONS_DIRECT_RESTORE$
      - run: dotnet restore $NAME$.slnx
      - run: dotnet build $NAME$.slnx --configuration Release --no-restore
      - run: dotnet test $NAME$.slnx --configuration Release --no-build
