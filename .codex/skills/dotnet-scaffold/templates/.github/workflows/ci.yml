name: CI

on:
  push:
  pull_request:

concurrency:
  group: $${{ github.workflow }}-$${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.x
$FUNCTIONS_DIRECT_RESTORE$
      - run: dotnet restore $NAME$.slnx
      - run: dotnet build $NAME$.slnx --configuration Release --no-restore
      - run: dotnet test $NAME$.slnx --configuration Release --no-build
