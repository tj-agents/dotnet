name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
$FUNCTIONS_DIRECT_RESTORE$
      - run: dotnet restore $NAME$.slnx
      - run: dotnet build $NAME$.slnx --configuration Release --no-restore
      - run: dotnet test $NAME$.slnx --configuration Release --no-build
